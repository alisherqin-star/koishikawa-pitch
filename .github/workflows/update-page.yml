name: 空き状況を更新

# 取得・通知・公開のすべてを GitHub 側で回す。Mac の電源とは無関係に動く。

on:
  schedule:
    # 10分ごと。ほとんどの回は日単位だけ見る軽い巡回（十数秒）で終わり、
    # 前回の全件走査から30分経っているか、監視対象の日が動いたときだけ
    # 全件走査に切り替わる（--tick が state の fullScanAt を見て判断する）。
    # GitHub の cron は UTC だが、このジョブは日付を Asia/Tokyo で計算するので
    # 時刻に依存しない。混雑時は数分遅れることがある。
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動実行ボタン
  push:
    branches: [main]
    # ワークフロー自身も含める。変更したのに検証実行が走らないと、
    # 壊れていても次の定時実行まで気づけない。
    paths:
      - 'src/**'
      - 'bin/**'
      - 'config.example.json'
      - 'config.actions.json'
      - 'actions-state.json'
      - '.github/workflows/update-page.yml'

permissions:
  contents: write

# 前の実行が終わる前に次が始まると push がぶつかるので直列化する。
concurrency:
  group: update-page
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 通知判定のテスト
        run: node --test 'test/*.test.mjs'

      # --tick は取得→前回状態との差分→Discord通知→ページ書き出しまでを1周期分行う。
      # 状態は actions-state.json としてリポジトリに残すので、次の実行が差分を取れる。
      # 軽い巡回だけで終わった回は state もページも変わらず、commit も発生しない。
      # 静音時間帯（23-7 JST）のイベントは state 内の保留リスト経由で朝に通知される。
      - name: 空き状況を取得して通知・ページ更新
        env:
          KOISHIKAWA_WEBHOOK_URL: ${{ secrets.KOISHIKAWA_WEBHOOK_URL }}
        run: node bin/watch.mjs --tick --config config.actions.json

      - name: 変更があれば commit して push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/.nojekyll actions-state.json
          if git diff --cached --quiet; then
            echo '軽い巡回のみ・変化なし'
            exit 0
          fi
          git commit -m "空き状況 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
