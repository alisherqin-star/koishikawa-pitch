<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奥西姆训练场</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap">
<style>
  /* Layout: night training session — a floodlit pitch fills the screen, drill tabs and scoreboard above, coach's call below. */
  :root {
    --bg: #0d1712;
    --panel: #15241c;
    --line: #2c4436;
    --fg: #e6efe8;
    --muted: #8ea597;
    --accent: #f5c518;
    --ink: #1b1600;
    --danger: #ff6b5e;
    --good: #5fd68b;
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: system-ui, -apple-system, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px;
         -webkit-tap-highlight-color: transparent; }
  .wrap { box-sizing: border-box; max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 20px;
          display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .02em;
       text-wrap: balance; }
  h1 small { font-weight: 500; font-size: 15px; color: var(--muted); margin-left: 8px; letter-spacing: .06em; }
  .ctrls { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
           padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; }

  .modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .modes button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 12px;
                  text-align: left; min-width: 0; }
  .modes b { font-size: 15px; }
  .modes span { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .modes button[aria-pressed="true"] span { color: var(--ink); opacity: .7; }

  .prefs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
  .prefs .grp { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .prefs .grow { flex: 1 1 260px; }
  .prefs .grow select { flex: 1 1 auto; }
  .prefs label { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .prefs input, .prefs select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
                                border-radius: 6px; padding: 5px 8px; min-width: 0; }
  .prefs input { width: 9em; }
  .prefs select { max-width: 24em; }
  .prefs label, .prefs button { white-space: nowrap; flex: none; }
  .prefs input:focus-visible, .prefs select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line);
           border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .board div { background: var(--panel); padding: 6px 10px; display: flex; flex-direction: column; min-width: 0; }
  .board span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .board b { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05;
             font-variant-numeric: tabular-nums; }
  #lives.hearts { color: var(--danger); letter-spacing: .1em; }

  .stage { position: relative; border-radius: 10px; overflow: hidden; background: #1d5a33;
           box-shadow: 0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.45); touch-action: none; }
  canvas { display: block; width: 100%; height: auto; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             background: rgba(8, 16, 11, .74); padding: 16px; overflow-y: auto; }
  .card { max-width: 540px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 800; text-wrap: balance; }
  .card p, .card li { margin: 0; line-height: 1.6; color: var(--fg); }
  .card ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
  .card .ctl { color: var(--muted); font-size: 12px; }
  .card .go { align-self: flex-start; background: var(--accent); color: var(--ink); border-color: var(--accent);
              font-weight: 800; font-size: 16px; padding: 8px 22px; }
  .card .stat { font-family: var(--display); font-size: 20px; color: var(--accent); }

  .rule { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-height: 34px;
          padding: 6px 12px; background: var(--panel); border-radius: 8px; border: 1px solid var(--line); }
  .rule .lbl { color: var(--muted); font-size: 12px; letter-spacing: .06em; }
  .rule .tip { color: var(--fg); }
  .rule .warn { color: var(--danger); font-weight: 700; }
  .chip { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 22px;
          padding: 0 6px; border-radius: 4px; font-weight: 800; font-size: 13px; color: #111; }
  .chip.no { position: relative; opacity: .85; }
  .chip.no::after { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 2px;
                    background: var(--danger); transform: rotate(-18deg); }
  #call { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--accent); }
  footer { font-size: 12px; color: var(--muted); line-height: 1.6; }
  footer a { color: var(--good); }
  #credits { font-size: 11px; }
  @media (max-width: 560px) {
    h1 { font-size: 22px; }
    .board b { font-size: 21px; }
    .board div { padding: 5px 8px; }
    .modes button { padding: 6px 8px; }
    .modes b { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="t-title">奥西姆训练场<small>OSIM DRILLS</small></h1>
    <div class="ctrls">
      <button id="lv-easy" data-lv="easy" aria-pressed="false">入门</button>
      <button id="lv-normal" data-lv="normal" aria-pressed="true">标准</button>
      <button id="lv-osim" data-lv="osim" aria-pressed="false">奥西姆</button>
      <button id="lang" title="中文 / 日本語">日本語</button>
      <button id="voice" aria-pressed="false" title="AI 语音 / 音声">语音</button>
      <button id="sound" aria-pressed="true" aria-label="sound">♪</button>
    </div>
  </header>

  <nav class="modes">
    <button id="md-multi" data-mode="multi" aria-pressed="true"><b>多色传球</b><span>MULTI-COLOUR</span></button>
    <button id="md-call" data-mode="call" aria-pressed="false"><b>传球训练</b><span>CALL &amp; PASS</span></button>
    <button id="md-rondo" data-mode="rondo" aria-pressed="false"><b>Rondo</b><span>RONDO 6+1</span></button>
  </nav>

  <div class="prefs">
    <span class="grp">
      <label for="myName" id="t-myName">你的名字</label>
      <input id="myName" maxlength="8" autocomplete="nickname" placeholder="你">
    </span>
    <span class="grp grow">
      <label for="voiceSel" id="t-voiceSel">声音</label>
      <select id="voiceSel"></select>
      <button id="voiceTest">试听</button>
    </span>
  </div>

  <div class="board" aria-live="polite">
    <div><span id="t-score">得分</span><b id="score">0</b></div>
    <div><span id="t-combo">连续传球</span><b id="combo">0</b></div>
    <div><span id="t-lives">机会</span><b id="lives" class="hearts">●●●</b></div>
    <div><span id="t-best">最高</span><b id="best">0</b></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="pitch"></canvas>
    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>

  <div class="rule" id="rulebar"></div>

  <footer id="t-foot"></footer>
  <footer id="credits" hidden></footer>
</div>

      easy:   { n: 5, defs: 0, touch: 4.0, minTouch: 3.0, aiHold: [0.8, 1.1], feed: 0.45, hints: true,  noNb: false, shuffle: false, bubble: 1.8,  lives: 3 },
      normal: { n: 6, defs: 0, touch: 3.0, minTouch: 2.0, aiHold: [0.55, 0.85], feed: 0.4, hints: false, noNb: false, shuffle: false, bubble: 1.3,  lives: 3 },
      osim:   { n: 6, defs: 0, touch: 2.4, minTouch: 1.6, aiHold: [0.4, 0.65], feed: 0.4, hints: false, noNb: true,  shuffle: true,  bubble: 0.8, lives: 3 }
    },
    rondo: {
      easy:   { n: 6, defs: 1, df: 90,  touch: 4.0, minTouch: 3.0, aiHold: [0.6, 0.9],  aiMax: 1.6, feed: 0.45, hints: true,  noNb: false, bubble: 1.8,  err: 0.3,  lives: 3 },
      normal: { n: 6, defs: 1, df: 115, touch: 3.0, minTouch: 2.2, aiHold: [0.45, 0.75], aiMax: 1.4, feed: 0.5, hints: false, noNb: false, bubble: 1.3,  err: 0.2,  lives: 3 },
      osim:   { n: 6, defs: 1, df: 135, touch: 2.4, minTouch: 1.8, aiHold: [0.3, 0.6],  aiMax: 1.2, feed: 0.5, hints: false, noNb: true,  bubble: 0.8, err: 0.12, lives: 3 }
    }
  };

  // ---------- 存储（可能不可用） ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('osim.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('osim.' + k, JSON.stringify(v)); } catch { /* ignore */ } }
  };

  let lang = store.get('lang', (navigator.language || '').startsWith('ja') ? 'ja' : 'zh');
  if (!STR[lang]) lang = 'zh';
  let mode = store.get('mode', 'multi');
  if (mode === 'pass') mode = 'call';
  if (!CFG[mode]) mode = 'multi';
  let level = store.get('level', 'normal');
  if (!CFG.multi[level]) level = 'normal';
  let soundOn = store.get('sound', true);
  let voiceOn = store.get('voice', false);
  const T = () => STR[lang];
  const bestKey = () => `best.${mode}.${level}`;
  const isRing = () => mode !== 'multi';

  // ---------- 画布 ----------
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const FONT = getComputedStyle(document.body).fontFamily;
  let W = 1000, H = 620, scale = 1, dpr = 1, CX = 500, CY = 310, RR = 250;
  const M = 44; // 场地内边距（标志桶位置）
  const R_P = 17, R_BALL = 7, BALL_SPEED = 760, ME_SPEED = 200;

  function resize() {
    const cssW = stage.clientWidth;
    const narrow = cssW < 700;
    const oldW = W, oldH = H;
    // 手机上缩小逻辑场地，让球员在屏幕上够大、好点
    W = narrow ? 540 : 1000;
    H = narrow ? clamp(Math.round(W * (window.innerHeight - 330) / cssW), 560, 760) : 620;
    CX = W / 2; CY = H / 2; RR = Math.min(W, H) / 2 - M - 8;
    scale = cssW / W;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    cv.style.height = (H * scale) + 'px';
    if (state && (oldW !== W || oldH !== H)) {
      const fit = p => { p.x = clamp(p.x / oldW * W, M, W - M); p.y = clamp(p.y / oldH * H, M, H - M); };
      for (const p of [...state.mates, ...state.defs]) {
        fit(p); p.tx = p.x; p.ty = p.y;
        if (state.ring && p.seated && state.mates.includes(p)) place(p);
      }
      if (state.ball) fit(state.ball);
      state.meTarget = null;
    }
  }

  // ---------- 工具 ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const pickOne = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
  const TAU = Math.PI * 2;
  function segDist(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy || 1;
    const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / L, 0, 1);
    return { d: Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t)), t };
  }
  function place(p) { p.x = CX + Math.cos(p.ang) * RR; p.y = CY + Math.sin(p.ang) * RR; }
  function ringPoint(ang) { return { x: CX + Math.cos(ang) * RR, y: CY + Math.sin(ang) * RR }; }
  function insideRing(p, r) {
    const dx = p.x - CX, dy = p.y - CY, d = Math.hypot(dx, dy);
    if (d > r) { p.x = CX + dx / d * r; p.y = CY + dy / d * r; }
  }

  // ---------- 声音 ----------
  let actx = null;
  function beep(freq, dur, type = 'sine', vol = 0.08) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g).connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch { /* ignore */ }
  }
  const sfx = {
    kick: () => beep(180, 0.08, 'triangle', 0.12),
    ok: () => beep(660, 0.09, 'sine', 0.06),
    soft: () => beep(330, 0.15, 'sine', 0.05),
    shout: () => beep(520, 0.07, 'sawtooth', 0.025),
    whistle: () => { beep(2300, 0.18, 'square', 0.04); setTimeout(() => beep(2300, 0.32, 'square', 0.04), 220); },
    call: () => beep(990, 0.12, 'triangle', 0.06)
  };

  // ---------- AI 语音：用浏览器自带的语音合成念出喊的名字 ----------
  const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  const langCode = () => (lang === 'ja' ? 'ja-JP' : 'zh-CN');
  function langVoices() {
    if (!canSpeak) return [];
    const pre = langCode().slice(0, 2);
    return window.speechSynthesis.getVoices().filter(v => (v.lang || '').replace('_', '-').toLowerCase().startsWith(pre));
  }
  // 给声音打分：神经网络 / 增强版的声音最自然，男声更像球场上的喊声，机械感重的往后排
  function voiceScore(v) {
    const n = v.name || '';
    let sc = 0;
    if (/Natural|Neural|Premium|Enhanced|Siri|高品質|高音質/i.test(n)) sc += 10;
    if (/Online|Google/i.test(n)) sc += 4;
    if (/Yunxi|Yunyang|Yunjian|Yunhao|Yunze|Keita|Naoki|Daichi|Otoya|Hattori|Ichiro|Li-mu|Kangkang|Yu-shu/i.test(n)) sc += 3;
    if (/compact|eSpeak|Grandpa|Grandma|Bubbles|Bells|Zarvox|Whisper/i.test(n)) sc -= 20;
    if (/zh-CN|ja-JP/i.test(v.lang)) sc += 1;
    return sc;
  }
  function pickVoice() {
    const list = langVoices();
    const want = store.get('voice.' + lang, '');
    return list.find(v => v.name === want) || list.sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
  }
  // pitch：每个队友音高略有不同，听起来像不同的人
  function speak(text, opts = {}) {
    if (!canSpeak || (!voiceOn && !opts.force)) return;
    try {
      const synth = window.speechSynthesis;
      synth.cancel(); // 只念最新的一句，免得和画面对不上
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langCode();
      const v = pickVoice();
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = opts.rate || 1.08;
      u.pitch = opts.pitch || 1;
      if (opts.primer) u.volume = 0; // 手机浏览器要在点击里先念一次才肯出声
      synth.speak(u);
    } catch { /* ignore */ }
  }
  const voicePitch = p => 0.88 + ((p.ni * 37) % 25) / 100;

  function fillVoices() {
    const sel = document.getElementById('voiceSel'), t = T(), list = langVoices();
    const want = store.get('voice.' + lang, '');
    sel.innerHTML = `<option value="">${t.voiceAuto}</option>` +
      list.sort((a, b) => voiceScore(b) - voiceScore(a))
        .map(v => `<option value="${v.name.replace(/"/g, '&quot;')}">${v.name.replace(/</g, '&lt;')}</option>`).join('');
    sel.value = list.some(v => v.name === want) ? want : '';
  }

  // ---------- 游戏状态 ----------
  let state = null;
  let nextId = 0;

  function mkMate(c, x, y) {
    return { id: nextId++, c, x, y, tx: x, ty: y, spd: rand(55, 85), vx: 0, vy: 0, seated: true };
  }

  function newGame() {
    const L = CFG[mode][level], ring = isRing();
    const mates = [], defs = [];
    if (ring) {
      // 名字随语言变，所以只存序号
      for (let i = 0; i < L.n; i++) {
        const p = mkMate(i === 0 ? 0 : 1, 0, 0);
        p.ni = i;
        p.home = p.ang = Math.PI / 2 + i * TAU / L.n;
        place(p);
        mates.push(p);
      }
      for (let i = 0; i < L.defs; i++) {
        defs.push({ id: nextId++, ni: L.n + i, c: -1, x: CX, y: CY, vx: 0, vy: 0, role: 'press', seated: true });
      }
    } else {
      for (let c = 0; c < L.colors; c++) {
        for (let i = 0; i < L.per; i++) mates.push(mkMate(c, rand(M + 30, W - M - 30), rand(M + 30, H - M - 30)));
      }
      mates.forEach(retarget);
      mates[0].x = W / 2; mates[0].y = H * 0.62;
      for (let i = 0; i < L.defs; i++) {
        defs.push({ id: nextId++, c: -1, x: rand(M, W - M), y: rand(M, H * 0.35), vx: 0, vy: 0, role: i === 0 ? 'press' : 'lane' });
      }
    }
    const me = mates[0];
    me.isMe = true;
    state = {
      mode, ring, L, mates, defs, me, score: 0, combo: 0, bestCombo: 0, lives: L.lives,
      passes: 0, stats: { myPasses: 0, touches: 0 },
      holder: null, prevColor: null, holdT: 0, aiDelay: 0, touch: L.touch, call: null, nextCallIn: 4,
      nextFor: null, nextBy: null, sel: null, bubbles: [],
      ball: null, queued: null, freeze: 0, floats: [], over: false, running: true,
      hover: null, flash: 0, meTarget: null, sinceMe: 0, pendingOver: false, clock: 0
    };
    giveBall(me, true);
    updateHud();
  }

  let myName = String(store.get('myname', '')).slice(0, 8);
  const nameOf = p => (p.ni === 0 && myName) || T().names[p.ni] || '?';

  // ---------- 球员头像 ----------
  // 从维基百科取条目主图（自由许可的照片），在浏览器里裁成圆形头像，并在页脚注明作者和许可证。
  // 取不到（离线、被拦截）就退回名字首字。
  const WIKI = ['', 'Lionel_Messi', 'Cristiano_Ronaldo', 'Kylian_Mbappé', 'Erling_Haaland', 'Luka_Modrić',
                'Kevin_De_Bruyne', 'Neymar', 'Jude_Bellingham'];
  const R_FACE = 21;
  const avatars = [];
  const credits = [];

  function cropFace(img, box) {
    const w = img.naturalWidth, h = img.naturalHeight, c = document.createElement('canvas');
    c.width = c.height = 96;
    let side, cx, cy;
    if (box) {
      side = Math.min(w, h, box.width * 1.7); cx = box.x + box.width / 2; cy = box.y + box.height * 0.48;
    } else if (h >= w) {
      // 竖构图：脸一般在上部居中
      side = w * 0.6; cx = w / 2; cy = h * 0.27;
    } else {
      side = h * 0.62; cx = w / 2; cy = h * 0.33;
    }
    const sx = clamp(cx - side / 2, 0, w - side), sy = clamp(cy - side / 2, 0, h - side);
    c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, 96, 96);
    return c;
  }

  async function loadAvatar(i) {
    const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(WIKI[i]));
    if (!res.ok) return;
    const data = await res.json();
    const src = data.thumbnail && data.thumbnail.source;
    if (!src) return;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = src.replace(/\/(\d+)px-/, '/400px-');
    await img.decode();
    let box = null;
    try {
      if ('FaceDetector' in window) {
        const faces = await new window.FaceDetector({ maxDetectedFaces: 1 }).detect(img);
        if (faces[0]) box = faces[0].boundingBox;
      }
    } catch { /* 不支持就用经验位置 */ }
    avatars[i] = cropFace(img, box);
    // 许可信息
    const orig = (data.originalimage && data.originalimage.source) || src;
    const parts = orig.split('/');
    const file = decodeURIComponent(parts.includes('thumb') ? parts[parts.length - 2] : parts[parts.length - 1]);
    const meta = await fetch('https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=extmetadata&format=json&origin=*&titles=' +
      encodeURIComponent('File:' + file)).then(r => r.json());
    const page = Object.values(meta.query.pages)[0];
    const ext = page.imageinfo ? page.imageinfo[0].extmetadata : {};
    const strip = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent.trim(); };
    credits[i] = { file, artist: strip(ext.Artist && ext.Artist.value), license: strip(ext.LicenseShortName && ext.LicenseShortName.value) };
    renderCredits();
  }

  function renderCredits() {
    const t = T(), el = document.getElementById('credits');
    const rows = [];
    credits.forEach((c, i) => {
      if (!c) return;
      const link = 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(c.file);
      rows.push(`${t.names[i]}：<a href="${link}" target="_blank" rel="noopener">${c.artist || 'Wikimedia Commons'}</a>${c.license ? '，' + c.license : ''}`);
    });
    el.hidden = !rows.length;
    el.innerHTML = rows.length ? `${t.photoCredit}${rows.join(' · ')}` : '';
  }

  function loadAvatars() {
    for (let i = 1; i < WIKI.length; i++) loadAvatar(i).catch(() => { /* 退回名字首字 */ });
  }

  function retarget(p) {
    p.tx = rand(M + 20, W - M - 20);
    p.ty = rand(M + 20, H - M - 20);
  }

  const meOutside = () => state.mates.includes(state.me);

  function nearestDef(p) {
    let best = null, bd = Infinity;
    for (const d of state.defs) { if (d === p) continue; const dd = dist(d, p); if (dd < bd) { bd = dd; best = d; } }
    return best;
  }

  function giveBall(p, fresh, oneTouchNext) {
    const s = state;
    s.holder = p;
    s.ball = { x: p.x, y: p.y, from: null, to: null, moving: false, trail: [] };
    s.holdT = 0;
    s.aiDelay = p.isMe ? 0 : rand(s.L.aiHold[0], s.L.aiHold[1]);
    if (p.isMe) s.meTarget = null;
    if (fresh) {
      s.prevColor = null; s.call = null; s.nextFor = null; s.nextBy = null; s.sel = null;
      if (!s.ring) {
        // 防守者被推开，给重新开始留空间
        for (const d of s.defs) {
          let a = Math.atan2(d.y - p.y, d.x - p.x);
          if (!isFinite(a)) a = rand(0, TAU);
          d.x = clamp(p.x + Math.cos(a) * 260, M, W - M);
          d.y = clamp(p.y + Math.sin(a) * 260, M, H - M);
        }
      }
    }
    // 已经预选了一脚出球时不喊色，否则玩家来不及反应
    if (!s.ring && p.isMe && !oneTouchNext) maybeCall(); else s.call = null;
    renderRule();
  }

  // ---------- 多色传球的规则 ----------
  function legalFor(from, m) {
    if (m.c === from.c) return false;
    if (state.L.back && m.c === state.prevColor) return false;
    return true;
  }

  function maybeCall() {
    const s = state;
    s.call = null;
    if (!s.L.calls || s.prevColor == null) return;
    s.nextCallIn--;
    if (s.nextCallIn > 0) return;
    const opts = [...new Set(s.mates.filter(m => m !== s.me && legalFor(s.me, m)).map(m => m.c))];
    if (!opts.length) return;
    s.call = pickOne(opts);
    s.nextCallIn = 3 + Math.floor(Math.random() * 4);
    sfx.call();
    speak(T().callTo(T().colors[BIBS[s.call].k]));
  }

  function faultReason(target) {
    const s = state, h = s.holder;
    if (target.c === h.c) return 'same';
    if (s.L.back && target.c === s.prevColor) return 'back';
    if (s.call != null && target.c !== s.call) return 'call';
    return null;
  }

  // ---------- 站圈传球的规则 ----------
  // 圈上按角度排序后相邻的两人
  function isNeighbor(a, b) {
    const key = p => (((p.seated ? p.ang : p.home) % TAU) + TAU) % TAU;
    const order = [...state.mates].sort((p, q) => key(p) - key(q));
    const i = order.indexOf(a), j = order.indexOf(b), n = order.length;
    if (i < 0 || j < 0) return false;
    const d = Math.abs(i - j);
    return d === 1 || d === n - 1;
  }

  // 传球线路的安全余量：>0 表示防守来不及断
  function laneSafety(a, b, defs) {
    const s = state, len = dist(a, b);
    let m = Infinity;
    for (const d of defs || s.defs) {
      const { d: dd, t } = segDist(d, a, b);
      const spd = s.L.df * 1.15;
      m = Math.min(m, dd - (R_P + R_BALL) - spd * (t * len / BALL_SPEED) * 0.9);
    }
    return m;
  }

  // 气泡里存被喊的人，画的时候再取名字，切换语言也能跟着变
  function bubble(p, who) {
    const s = state;
    s.bubbles = s.bubbles.filter(b => b.p !== p);
    s.bubbles.push({ p, who, t: 0, life: s.L.bubble || 1.2 });
  }

  // call：接球人下一脚要传给的人（站圈模式）
  function pass(from, to, oneTouch, call) {
    const s = state;
    if (!s.ring && from.isMe) {
      const why = faultReason(to);
      if (why) { fault(why, from, nearestDef(from)); return; }
    }
    s.ball = { x: from.x, y: from.y, from, to, moving: true, trail: [], calledBy: s.nextBy,
               oneTouch: from.isMe && (oneTouch || s.holdT < 0.5), wasCall: from.isMe && s.call != null };
    s.prevColor = from.c;
    s.holder = null;
    s.call = null;
    s.queued = null;
    s.sel = null;
    to.vx = to.vy = 0;
    if (s.ring) {
      s.nextFor = call || null; s.nextBy = from;
      if (call) {
        bubble(from, call); sfx.shout();
        // 喊到你时语气更急一点
        speak(nameOf(call) + '！', { pitch: voicePitch(from), rate: call.isMe ? 1.15 : 1.08 });
      }
    }
    sfx.kick();
    renderRule();
  }

  // 你在站圈模式里出球：先检查传没传对人、喊得合不合规
  function myRingPass(a, b, oneTouch) {
    const s = state, me = s.me;
    if (s.nextFor && a !== s.nextFor) { fault('wrong', me, nearestDef(me)); return; }
    if (s.L.noNb && isNeighbor(a, b)) { fault('neighbor', me, nearestDef(me)); return; }
    pass(me, a, oneTouch, b);
  }

  function aiPass(h) {
    const s = state, me = s.me;
    const legal = s.mates.filter(m => m !== h && legalFor(h, m));
    if (!legal.length) { pass(h, pickOne(s.mates.filter(m => m !== h))); return; }
    const scored = legal.map(m => ({ m, safe: laneSafety(h, m) }));
    const safe = scored.filter(x => x.safe > 4);
    const meOpt = safe.find(x => x.m.isMe);
    let choice;
    if (meOpt && Math.random() < s.L.feed + 0.15 * s.sinceMe) choice = me;
    else if (safe.length) {
      const others = safe.filter(x => !x.m.isMe);
      choice = pickOne(others.length ? others : safe).m;
    } else choice = scored.sort((a, b) => b.safe - a.safe)[0].m;
    s.sinceMe = choice === me ? 0 : s.sinceMe + 1;
    pass(h, choice);
  }

  // 站圈模式的队友：传给被喊的人，同时替下一个人喊名字
  function aiRingPass(h) {
    const s = state, me = s.me;
    const seated = s.mates.filter(m => m !== h && m.seated !== false);
    let target = s.nextFor;
    if (!target || target === h) {
      const meOk = meOutside() && seated.includes(me);
      target = meOk && Math.random() < s.L.feed ? me : pickOne(seated.filter(m => !m.isMe).length ? seated.filter(m => !m.isMe) : seated);
    }
    // 线路被封时等一下，等不了就硬传
    if (s.defs.length && laneSafety(h, target) < 0 && s.holdT < s.L.aiMax) return;
    let cands = s.mates.filter(m => m !== target && m !== h && m.seated !== false);
    if (s.L.noNb) cands = cands.filter(m => !isNeighbor(target, m));
    if (!cands.length) cands = s.mates.filter(m => m !== target);
    let call;
    if (s.defs.length && Math.random() >= (s.L.err || 0)) {
      // 预判逼抢的人：他会朝接球人跑，等接球人出球时大概跑到哪
      const flight = dist(h, target) / BALL_SPEED + 0.35;
      const predicted = s.defs.map(d => {
        const dd = dist(d, target), step = Math.min(dd - R_P * 2, s.L.df * flight);
        return dd > 1 ? { x: d.x + (target.x - d.x) / dd * Math.max(0, step), y: d.y + (target.y - d.y) / dd * Math.max(0, step) } : d;
      });
      const ok = cands.filter(m => laneSafety(target, m, predicted) > 18);
      if (ok.length) cands = ok;
    }
    const meCand = cands.includes(me);
    if (meCand && Math.random() < s.L.feed + 0.2 * s.sinceMe) call = me;
    else call = pickOne(cands.filter(m => !m.isMe).length ? cands.filter(m => !m.isMe) : cands);
    s.sinceMe = call === me ? 0 : s.sinceMe + 1;
    pass(h, target, false, call);
  }

  function shuffleRing() {
    const s = state;
    const pool = s.mates.filter(m => !m.isMe && m !== s.holder && m !== s.nextFor && m.seated);
    if (pool.length < 2) return;
    const a = pickOne(pool), b = pickOne(pool.filter(x => x !== a));
    [a.home, b.home] = [b.home, a.home];
    a.seated = b.seated = false;
  }

  function receive(target) {
    const s = state, b = s.ball, from = b.from, t = T();
    const meIn = !meOutside();
    s.passes++; s.combo++;
    s.bestCombo = Math.max(s.bestCombo, s.combo);
    let pts = 0, label = null, color = '#ffffff';
    if (from.isMe) {
      pts = 10 + Math.floor(s.combo / 5) * 5;
      label = '+' + pts;
      if (b.oneTouch) { pts += 5; label = t.oneTouch + ' +' + pts; color = '#f5c518'; }
      if (b.wasCall) { pts += 10; label = t.callOk + ' +' + pts; color = '#f5c518'; }
      s.stats.myPasses++;
      if (s.stats.myPasses % 8 === 0) s.touch = Math.max(s.L.minTouch, s.touch * 0.93);
    } else if (target.isMe) {
      pts = 5;
    } else if (!meIn) {
      pts = 2;
      // 你喊的名字让这一脚传成了
      if (s.ring && b.calledBy === s.me) { pts = 5; label = t.goodCall + ' +5'; color = '#5fd68b'; }
    }
    if (target.isMe) s.stats.touches++;
    s.score += pts;
    if (label) floatText(target.x, target.y - 30, label, color);
    if (from.isMe || target.isMe) sfx.ok();
    const q = s.queued;
    s.queued = null;
    const oneTouchNext = target.isMe && q && (s.ring ? q.a && q.b : q !== target);
    giveBall(target, false, oneTouchNext);
    if (s.ring && s.L.shuffle && s.passes % 5 === 0) shuffleRing();
    updateHud();
    if (oneTouchNext) {
      if (s.ring) myRingPass(q.a, q.b, true);
      else pass(target, q, true);
    }
  }

  // loser：丢球的人；winner：抢到球的防守（可能为空）
  function fault(why, loser, winner) {
    const s = state, t = T(), me = s.me;
    const meLost = loser === me;
    s.combo = 0; s.queued = null; s.call = null; s.sel = null; s.nextFor = null; s.nextBy = null;
    s.holder = null; s.ball.moving = false;
    const at = loser || s.ball;
    if (meLost) {
      s.lives--; s.flash = 1;
      floatText(at.x, at.y - 34, t.fault[why], '#ff6b5e', 1.4);
      sfx.whistle();
      s.freeze = 1.4;
      if (s.lives <= 0) s.pendingOver = true;
    } else if (s.mode === 'rondo') {
      floatText(at.x, at.y - 34, (t.mateFault[why] || t.mateFault.cut) + ' · ' + t.swap, '#d6e2da', 1.1);
      sfx.soft();
      swap(loser, winner || nearestDef(loser));
      s.freeze = 1.1;
    } else {
      floatText(at.x, at.y - 34, t.mateFault[why] || t.mateFault.cut, '#d6e2da', 1.1);
      sfx.soft();
      s.freeze = 0.9;
    }
    updateHud();
    renderRule();
  }

  // Rondo：丢球的队友进圈，逼抢的人出来接替他在圈上的位置（你自己不会进圈）
  function swap(loser, w) {
    const s = state;
    if (!w || loser.isMe) return;
    const iM = s.mates.indexOf(loser), iD = s.defs.indexOf(w);
    if (iM < 0 || iD < 0) return;
    s.mates[iM] = w; s.defs[iD] = loser;
    const role = w.role;
    w.c = 1; w.home = loser.home; w.seated = false; w.role = undefined;
    loser.c = -1; loser.home = null; loser.seated = false; loser.role = role;
  }

  function restart() {
    const s = state;
    const pool = s.mates.filter(m => m.seated !== false && s.defs.every(d => dist(d, m) > 140));
    giveBall(pickOne(pool.length ? pool : s.mates), true);
  }

  function floatText(x, y, text, color, life = 1) {
    state.floats.push({ x, y, text, color, t: 0, life });
  }

  // ---------- 更新 ----------
  function steer(p, tx, ty, spd, dt) {
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    const want = d > 1 ? Math.min(spd, d * 3) : 0;
    const vx = d > 1 ? dx / d * want : 0, vy = d > 1 ? dy / d * want : 0;
    const k = Math.min(1, dt * 6);
    p.vx += (vx - p.vx) * k; p.vy += (vy - p.vy) * k;
    p.x = clamp(p.x + p.vx * dt, M, W - M);
    p.y = clamp(p.y + p.vy * dt, M, H - M);
    return d;
  }

  function separate() {
    const s = state, all = [...s.mates, ...s.defs];
    const fixed = p => p.lock || (s.ring && p.c >= 0);
    for (let i = 0; i < all.length; i++) {
      for (let j = i + 1; j < all.length; j++) {
        const a = all[i], b = all[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = R_P * 2 + 6;
        if (d < min) {
          const fa = fixed(a), fb = fixed(b);
          if (fa && fb) continue;
          const push = (min - d) / (fa || fb ? 1 : 2), nx = dx / d, ny = dy / d;
          if (!fa) { a.x -= nx * push; a.y -= ny * push; }
          if (!fb) { b.x += nx * push; b.y += ny * push; }
        }
      }
    }
  }

  const keys = new Set();
  function keyTarget() {
    const s = state, me = s.me;
    let dx = 0, dy = 0;
    if (keys.has('ArrowLeft') || keys.has('a')) dx--;
    if (keys.has('ArrowRight') || keys.has('d')) dx++;
    if (keys.has('ArrowUp') || keys.has('w')) dy--;
    if (keys.has('ArrowDown') || keys.has('s')) dy++;
    if (dx || dy) setMeTarget({ x: me.x + dx * 70, y: me.y + dy * 70 });
  }

  function ringMove(p, dt) {
    const s = state;
    if (!p.seated) {
      if (p.lock) { p.vx *= 0.8; p.vy *= 0.8; return; }
      const h = ringPoint(p.home);
      if (steer(p, h.x, h.y, 320, dt) < 8) { p.seated = true; p.ang = p.home; place(p); }
      return;
    }
    if (p.lock) { place(p); return; }
    let target;
    if (p.isMe) {
      target = s.meTarget ? Math.atan2(s.meTarget.y - CY, s.meTarget.x - CX) : p.ang;
    } else {
      target = p.home + Math.sin(s.clock * 0.8 + p.id) * (s.defs.length ? 0.12 : 0.04);
      const me = s.me;
      if (meOutside() && me.seated) {
        const dd = angDiff(me.ang, target);
        if (Math.abs(dd) < 0.36) target = me.ang + (dd >= 0 ? 0.36 : -0.36);
      }
    }
    const step = (p.isMe ? ME_SPEED : 90) / RR * dt;
    p.ang += clamp(angDiff(p.ang, target), -step, step);
    place(p);
  }

  function moveMates(dt) {
    const s = state, b = s.ball;
    for (const p of s.mates) {
      p.lock = p === s.holder || (b.moving && b.to === p);
      if (s.ring) { ringMove(p, dt); continue; }
      if (p.lock) { p.vx *= 0.8; p.vy *= 0.8; continue; }
      if (p.isMe) {
        if (s.meTarget) steer(p, s.meTarget.x, s.meTarget.y, ME_SPEED, dt);
        else { p.vx *= 0.85; p.vy *= 0.85; }
        continue;
      }
      if (steer(p, p.tx, p.ty, p.spd, dt) < 12) retarget(p);
    }
  }

  function moveDefs(dt, frozen) {
    const s = state, L = s.L, ring = s.ring;
    let laneIdx = 0;
    s.defs.forEach((d, i) => {
      d.lock = false;
      if (ring && (!d.seated || frozen)) {
        steer(d, CX + (i % 2 ? 36 : 0), CY, d.seated ? L.df : 420, dt);
        if (dist(d, { x: CX, y: CY }) < RR - 40) d.seated = true;
        return;
      }
      if (frozen) { d.vx *= 0.9; d.vy *= 0.9; d.x += d.vx * dt; d.y += d.vy * dt; return; }
      let tx = d.x, ty = d.y, spd = L.df;
      const b = s.ball;
      if (b.moving) {
        const to = b.to, near = segDist(d, b, to);
        if (ring && near.d > 90) {
          // 断不到这一脚，就去逼接球的人
          tx = to.x; ty = to.y;
        } else {
          // 追向传球路线上的前方点
          const tt = Math.max(near.t, 0.25);
          tx = b.x + (to.x - b.x) * tt; ty = b.y + (to.y - b.y) * tt;
          spd *= 1.15;
        }
      } else if (s.holder && ring) {
        // 直接逼持球人，持球越久逼得越快
        tx = s.holder.x; ty = s.holder.y;
        spd *= 0.9 + Math.min(s.holdT, 2) * 0.2;
      } else if (s.holder && d.role === 'press') {
        tx = s.holder.x; ty = s.holder.y;
        spd *= 0.9 + Math.min(s.holdT, 2) * 0.25;
      } else if (s.holder) {
        // 封堵：盯离持球人第 n 近的合法接球人线路
        const h = s.holder;
        const legal = s.mates.filter(m => m !== h && legalFor(h, m)).sort((a, c) => dist(a, h) - dist(c, h));
        const tgt = legal[laneIdx++ % Math.max(1, legal.length)] || h;
        tx = h.x * 0.45 + tgt.x * 0.55; ty = h.y * 0.45 + tgt.y * 0.55;
      } else if (ring) { tx = CX; ty = CY; }
      steer(d, tx, ty, spd, dt);
      if (ring) insideRing(d, RR - 24);
    });
  }

  function update(dt) {
    const s = state;
    if (!s) return;
    s.clock += dt;
    s.flash = Math.max(0, s.flash - dt * 2.5);
    s.floats = s.floats.filter(f => (f.t += dt) < f.life);
    s.bubbles = s.bubbles.filter(b => (b.t += dt) < b.life);
    if (keys.size && s.holder !== s.me) keyTarget();

    moveMates(dt);

    if (s.freeze > 0) {
      s.freeze -= dt;
      moveDefs(dt, true);
      separate();
      if (s.freeze <= 0) {
        s.freeze = 0;
        if (s.pendingOver) { gameOver(); return; }
        restart();
      }
      return;
    }

    moveDefs(dt, false);
    separate();

    const b = s.ball;
    if (b.moving) {
      const to = b.to;
      const dx = to.x - b.x, dy = to.y - b.y, d = Math.hypot(dx, dy);
      const step = BALL_SPEED * dt;
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 10) b.trail.shift();
      // 断球检测（分段，防止穿透）
      const n = Math.max(1, Math.ceil(step / 8));
      for (let k = 1; k <= n; k++) {
        const f = Math.min(1, step * k / n / Math.max(d, 0.001));
        const px = b.x + dx * f, py = b.y + dy * f;
        for (const df of s.defs) {
          if (Math.hypot(df.x - px, df.y - py) < R_P + R_BALL - 2) {
            b.x = px; b.y = py;
            fault('cut', b.from, df);
            return;
          }
        }
      }
      if (d <= step + R_P * 0.6) { b.x = to.x; b.y = to.y; b.moving = false; receive(to); }
      else { b.x += dx / d * step; b.y += dy / d * step; }
    } else if (s.holder) {
      const h = s.holder;
      s.holdT += dt;
      b.x = h.x; b.y = h.y;
      if (h.isMe) {
        if (s.holdT > s.touch) { fault('slow', h, nearestDef(h)); return; }
      } else {
        const pressed = s.defs.some(d => dist(d, h) < 78);
        if (s.holdT >= s.aiDelay || (pressed && s.holdT > (s.ring ? 0.3 : 0.15))) {
          if (s.ring) aiRingPass(h); else aiPass(h);
          if (s.holder !== h) return;
        }
      }
      for (const df of s.defs) {
        if (df.role === 'press' && dist(df, h) < R_P * 2 + 4 && s.holdT > 0.35) {
          fault('tackle', h, df);
          return;
        }
      }
    }
  }

  // ---------- 绘制 ----------
  function drawPitch() {
    const stripe = 80;
    for (let x = 0; x < W; x += stripe) {
      ctx.fillStyle = (x / stripe) % 2 ? '#22663a' : '#1f5e35';
      ctx.fillRect(x, 0, stripe, H);
    }
    // 照明光晕
    const g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,255,230,0.08)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const cone = (cx, cy) => {
      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath(); ctx.moveTo(cx, cy - 11); ctx.lineTo(cx + 8, cy + 7); ctx.lineTo(cx - 8, cy + 7); ctx.closePath(); ctx.fill();
    };
    if (isRing()) {
      ctx.strokeStyle = 'rgba(244,247,242,0.7)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(CX, CY, RR, 0, TAU); ctx.stroke();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; cone(CX + Math.cos(a) * (RR + 30), CY + Math.sin(a) * (RR + 30)); }
      return;
    }
    ctx.strokeStyle = 'rgba(244,247,242,0.75)'; ctx.lineWidth = 3;
    ctx.strokeRect(M - 14, M - 14, W - 2 * M + 28, H - 2 * M + 28);
    ctx.setLineDash([10, 12]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(244,247,242,0.25)';
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 70, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    for (const [cx, cy] of [[M - 14, M - 14], [W - M + 14, M - 14], [M - 14, H - M + 14], [W - M + 14, H - M + 14],
                            [W / 2, M - 14], [W / 2, H - M + 14]]) cone(cx, cy);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }

  function drawPlayer(p, alpha = 1) {
    const t = T(), s = state, def = p.c < 0, bib = def ? null : BIBS[p.c];
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(p.x + 3, p.y + 6, R_P, R_P * 0.7, 0, 0, TAU); ctx.fill();
    const face = s.ring && !p.isMe ? avatars[p.ni] : null;
    const r = face ? R_FACE : R_P;
    ctx.fillStyle = def ? '#141414' : bib.fill; ctx.strokeStyle = def ? '#3b3b3b' : bib.edge; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
    if (face) {
      ctx.save(); ctx.clip();
      ctx.drawImage(face, p.x - r, p.y - r, r * 2, r * 2);
      ctx.restore();
      // 逼抢的人用黑色粗边框区分
      ctx.lineWidth = def ? 5 : 3;
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (s.ring) {
      // 站圈模式：有头像画头像，没有就写名字首字；下方写全名
      const name = nameOf(p);
      if (!face) {
        ctx.fillStyle = def ? '#c9c9c9' : '#111';
        ctx.font = '800 15px ' + FONT;
        ctx.fillText(name.slice(0, 1), p.x, p.y + 1);
      }
      if (!p.isMe) {
        ctx.font = '700 13px ' + FONT;
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.65)';
        ctx.strokeText(name, p.x, p.y + r + 12); ctx.fillStyle = '#ffffff'; ctx.fillText(name, p.x, p.y + r + 12);
      }
    } else {
      ctx.fillStyle = def ? '#9a9a9a' : '#111';
      ctx.font = '700 16px ' + FONT;
      ctx.fillText(def ? '×' : t.colors[bib.k], p.x, p.y + 1);
    }
    ctx.globalAlpha = 1;
    if (p.isMe) {
      ctx.strokeStyle = '#f5c518'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, R_P + 4, 0, TAU); ctx.stroke();
      ctx.font = '800 13px ' + FONT;
      const w = ctx.measureText(t.me).width + 12, y = p.y - R_P - 20;
      ctx.fillStyle = '#f5c518';
      roundRect(p.x - w / 2, y - 9, w, 18, 4); ctx.fill();
      ctx.beginPath(); ctx.moveTo(p.x - 5, y + 9); ctx.lineTo(p.x + 5, y + 9); ctx.lineTo(p.x, y + 14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1b1600'; ctx.fillText(t.me, p.x, y + 1);
    }
  }

  function drawBubble(b) {
    const p = b.p, a = Math.min(1, (b.life - b.t) / 0.25), text = nameOf(b.who) + '！';
    ctx.globalAlpha = a;
    ctx.font = '800 17px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width + 16, y = p.y - R_P - (p.isMe ? 46 : 24);
    ctx.fillStyle = '#ffffff';
    roundRect(p.x - w / 2, y - 13, w, 26, 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(p.x - 6, y + 12); ctx.lineTo(p.x + 6, y + 12); ctx.lineTo(p.x, y + 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#111'; ctx.fillText(text, p.x, y + 1);
    ctx.globalAlpha = 1;
  }

  function dashed(a, b, color, dash = [6, 8], w = 2) {
    ctx.setLineDash(dash); ctx.lineWidth = w; ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
  }
  function ringAround(p, color, extra = 8, w = 2) {
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.arc(p.x, p.y, R_P + extra, 0, TAU); ctx.stroke();
  }

  function draw() {
    const s = state;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    drawPitch();
    if (!s) return;
    const me = s.me, b = s.ball, now = performance.now();
    const meCanAim = !s.freeze && (s.holder === me || (b.moving && b.to === me));

    // 悬停预览线
    if (s.hover && meCanAim) dashed(me, s.hover, 'rgba(255,255,255,0.55)');
    if (s.ring) {
      // 已选的接球人和预选的一脚出球
      if (s.sel && meCanAim) { dashed(me, s.sel, 'rgba(245,197,24,0.85)', [3, 6]); ringAround(s.sel, 'rgba(245,197,24,0.9)'); }
      if (s.queued && s.queued.b) {
        dashed(me, s.queued.a, 'rgba(245,197,24,0.85)', [3, 6]);
        dashed(s.queued.a, s.queued.b, 'rgba(245,197,24,0.4)', [2, 6]);
        ringAround(s.queued.a, 'rgba(245,197,24,0.9)');
      }
    } else {
      if (s.queued && b.moving) {
        dashed(me, s.queued, 'rgba(245,197,24,0.85)', [3, 6]);
        ringAround(s.queued, 'rgba(245,197,24,0.85)');
      }
      // 入门提示：队友能传给你时显示一条绿线
      if (s.L.hints && s.holder && !s.holder.isMe && meOutside() && !s.freeze &&
          legalFor(s.holder, me) && laneSafety(s.holder, me) > 4) {
        dashed(s.holder, me, 'rgba(95,214,139,0.6)', [4, 6]);
      }
    }
    // 你的跑位目标
    if (s.meTarget && s.holder !== me && dist(me, s.meTarget) > 14 && !(s.ring && meOutside())) {
      const m = s.meTarget;
      ctx.strokeStyle = 'rgba(245,197,24,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(m.x - 6, m.y - 6); ctx.lineTo(m.x + 6, m.y + 6); ctx.moveTo(m.x + 6, m.y - 6); ctx.lineTo(m.x - 6, m.y + 6); ctx.stroke();
    }

    // 入门提示：不能接球的队友变暗
    let illegal = null;
    if (!s.ring && s.L.hints && s.holder === me && !s.freeze) illegal = new Set(s.mates.filter(m => m !== me && faultReason(m)));

    for (const p of s.mates) {
      if (p.isMe) continue;
      drawPlayer(p, illegal && illegal.has(p) ? 0.35 : 1);
      if (s.call != null && p.c === s.call && s.holder === me) ringAround(p, '#f5c518', 6 + Math.sin(now / 120) * 2);
    }
    for (const d of s.defs) if (!d.isMe) drawPlayer(d);
    drawPlayer(me);

    // 你持球时的计时圈
    if (s.holder === me && !s.freeze) {
      const frac = clamp(1 - s.holdT / s.touch, 0, 1);
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(me.x, me.y, R_P + 10, 0, TAU); ctx.stroke();
      ctx.strokeStyle = frac > 0.5 ? '#ffffff' : frac > 0.25 ? '#f5c518' : '#ff6b5e';
      ctx.beginPath(); ctx.arc(me.x, me.y, R_P + 10, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.stroke();
    }

    // 球
    b.trail.forEach((p, i) => {
      ctx.fillStyle = `rgba(255,255,255,${(i + 1) / b.trail.length * 0.3})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, R_BALL * (0.4 + i / b.trail.length * 0.5), 0, TAU); ctx.fill();
    });
    const bx = s.holder ? b.x + 12 : b.x, by = s.holder ? b.y + 12 : b.y;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, R_BALL, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(bx, by, 2.4, 0, TAU); ctx.fill();

    for (const bb of s.bubbles) drawBubble(bb);

    // 飘字
    for (const f of s.floats) {
      const a = 1 - f.t / f.life;
      ctx.globalAlpha = a; ctx.fillStyle = f.color;
      ctx.font = '800 22px "Barlow Condensed", ' + FONT;
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 4;
      const x = clamp(f.x, 90, W - 90);
      ctx.strokeText(f.text, x, f.y - f.t * 30); ctx.fillText(f.text, x, f.y - f.t * 30);
      ctx.globalAlpha = 1;
    }
    // 犯规闪红
    if (s.flash > 0) { ctx.fillStyle = `rgba(255,60,50,${s.flash * 0.22})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- HUD ----------
  const $ = id => document.getElementById(id);
  function updateHud() {
    const s = state, t = T(), lives = $('lives');
    $('score').textContent = s ? s.score : 0;
    $('combo').textContent = s ? s.combo : 0;
    const n = s ? Math.max(0, s.lives) : 3;
    $('t-lives').textContent = t.lives;
    lives.textContent = '●'.repeat(n) + '○'.repeat(Math.max(0, 3 - n));
    $('best').textContent = store.get(bestKey(), 0);
  }

  function chip(c, no) {
    const b = BIBS[c];
    return `<span class="chip${no ? ' no' : ''}" style="background:${b.fill}">${T().colors[b.k]}</span>`;
  }
  const ruleText = () => T().ruleText[isRing() ? 'ring' : 'multi'][level];

  function renderRule() {
    const t = T(), s = state, bar = $('rulebar');
    if (!s) { bar.innerHTML = `<span class="lbl">${t.mode[mode]}</span><span class="tip">${ruleText()}</span>`; return; }
    const me = s.me;
    if (s.ring) {
      let html;
      if (s.holder === me || (s.ball.moving && s.ball.to === me)) {
        html = `<span class="tip">${s.sel ? t.picked(nameOf(s.sel)) : t.pickFirst}</span>`;
      } else if (s.nextFor === me && s.ball.moving) html = `<span class="warn">${t.nextYou}</span>`;
      else html = `<span class="tip">${t.listen}</span>` + (s.mode === 'rondo' ? `<span class="lbl">${t.tipRing}</span>` : '');
      bar.innerHTML = html + `<span class="lbl">${ruleText()}</span>`;
      return;
    }
    if (s.holder !== me) {
      bar.innerHTML = `${chip(me.c)}<span class="tip">${t.tipOff}</span><span class="lbl">${ruleText()}</span>`;
      return;
    }
    let html = `<span class="lbl">${t.ruleLbl}</span>${chip(me.c)}`;
    if (s.L.hints) {
      const no = [me.c];
      if (s.L.back && s.prevColor != null && s.prevColor !== me.c) no.push(s.prevColor);
      html += `<span class="lbl">${t.noLbl}</span>${no.map(c => chip(c, true)).join('')}`;
    } else {
      html += `<span class="lbl">${ruleText()}</span>`;
    }
    if (s.call != null) html += `<span id="call">${t.callLbl}${t.callTo(t.colors[BIBS[s.call].k])}</span>`;
    bar.innerHTML = html;
  }

  function showCard(kind) {
    const t = T(), card = $('card');
    if (kind === 'intro') {
      card.innerHTML = `<h2>${t.mode[mode]} · ${t.lv[level]}</h2><ul>${t.intro[mode].map(x => `<li>${x}</li>`).join('')}</ul>
        <p class="ctl">${t.controls[isRing() ? 'ring' : 'multi']}</p>
        <button class="go" id="go">${t.start}</button>`;
    } else {
      const s = state, key = bestKey(), prev = store.get(key, 0), isBest = s.score > prev && !s.bestSaved;
      if (isBest) { store.set(key, s.score); s.bestSaved = true; }
      card.innerHTML = `<h2>${t.overH}${s.bestSaved ? ' · ' + t.newBest : ''}</h2>
        <p class="stat">${t.overStat(s.score, s.bestCombo, Math.max(prev, s.score))}</p>
        <p>${t.overMore(s.stats)}</p>
        <button class="go" id="go">${t.again}</button>`;
    }
    $('overlay').hidden = false;
    $('go').addEventListener('click', start);
    $('go').focus({ preventScroll: true });
  }

  function gameOver() {
    state.running = false; state.over = true;
    showCard('over');
    updateHud();
  }

  function start() {
    $('overlay').hidden = true;
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch { /* ignore */ }
    speak(' ', { primer: true });
    newGame();
  }

  // ---------- 输入 ----------
  function toLogical(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function pick(pt, exclude, radius = 60) {
    let best = null, bd = radius;
    for (const m of state.mates) {
      if (m === exclude) continue;
      const d = dist(pt, m);
      if (d < bd) { bd = d; best = m; }
    }
    return best;
  }
  function setMeTarget(pt) {
    const s = state;
    const p = { x: clamp(pt.x, M, W - M), y: clamp(pt.y, M, H - M) };
    s.meTarget = p;
  }

  // 站圈模式：第一下点接球人，第二下点要喊的名字
  function ringTap(pt) {
    const s = state, me = s.me, holding = s.holder === me;
    const tgt = pick(pt, me, 48);
    if (!tgt) return;
    if (!s.sel) { s.sel = tgt; s.queued = null; renderRule(); return; }
    if (tgt === s.sel) { s.sel = null; s.queued = null; renderRule(); return; }
    if (holding) myRingPass(s.sel, tgt, false);
    else { s.queued = { a: s.sel, b: tgt }; s.sel = null; renderRule(); }
  }

  let dragging = false;
  cv.addEventListener('pointerdown', e => {
    const s = state;
    if (!s || !s.running || s.freeze > 0) return;
    e.preventDefault();
    const pt = toLogical(e), me = s.me, b = s.ball;
    const meOnBall = s.holder === me || (b.moving && b.to === me);
    if (s.ring) {
      if (meOnBall) { ringTap(pt); return; }
      if (s.mode !== 'rondo') return; // 传球训练里站着不动
    } else {
      if (s.holder === me) { const tgt = pick(pt, me); if (tgt) pass(me, tgt, false); return; }
      if (b.moving && b.to === me) { const tgt = pick(pt, me); if (tgt) s.queued = tgt; return; }
    }
    setMeTarget(pt);
    dragging = true;
    try { cv.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  });
  cv.addEventListener('pointermove', e => {
    const s = state;
    if (!s) return;
    const pt = toLogical(e);
    if (dragging && s.running && s.holder !== s.me && !(s.ball.moving && s.ball.to === s.me)) setMeTarget(pt);
    if (e.pointerType === 'mouse') s.hover = pick(pt, s.me, 48);
  });
  const endDrag = () => { dragging = false; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('pointerleave', () => { if (state) state.hover = null; });
  const KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'a', 'd', 'w', 's'];
  window.addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (!KEYS.includes(k) || !state || !state.running || state.mode === 'call') return;
    keys.add(k); e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key); });
  window.addEventListener('blur', () => keys.clear());

  // ---------- 设置 ----------
  function applyLang() {
    const t = T();
    document.documentElement.lang = lang;
    document.title = t.title;
    $('t-title').firstChild.textContent = t.title;
    $('t-score').textContent = t.score; $('t-combo').textContent = t.combo;
    $('t-best').textContent = t.best;
    for (const k of Object.keys(CFG.multi)) $('lv-' + k).textContent = t.lv[k];
    for (const k of Object.keys(CFG)) $('md-' + k).querySelector('b').textContent = t.mode[k];
    $('lang').textContent = t.langBtn;
    $('voice').textContent = t.voiceBtn;
    $('t-myName').textContent = t.myNameLbl; $('t-voiceSel').textContent = t.voiceLbl;
    $('voiceTest').textContent = t.voiceTest;
    $('myName').placeholder = t.names[0];
    fillVoices();
    if (!canSpeak) $('voice').title = t.voiceNo;
    $('t-foot').innerHTML = t.foot;
    renderCredits();
    updateHud();
    renderRule();
    if (!$('overlay').hidden) showCard(state && state.over ? 'over' : 'intro');
  }
  function applyChoice() {
    for (const k of Object.keys(CFG.multi)) $('lv-' + k).setAttribute('aria-pressed', String(k === level));
    for (const k of Object.keys(CFG)) $('md-' + k).setAttribute('aria-pressed', String(k === mode));
  }
  function reset() {
    state = null; keys.clear(); applyChoice(); updateHud(); renderRule(); showCard('intro');
  }
  document.querySelectorAll('[data-lv]').forEach(btn => btn.addEventListener('click', () => {
    level = btn.dataset.lv; store.set('level', level); reset();
  }));
  document.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => {
    mode = btn.dataset.mode; store.set('mode', mode); reset();
  }));
  $('lang').addEventListener('click', () => { lang = lang === 'zh' ? 'ja' : 'zh'; store.set('lang', lang); applyLang(); });
  $('sound').addEventListener('click', () => {
    soundOn = !soundOn; store.set('sound', soundOn);
    $('sound').setAttribute('aria-pressed', String(soundOn));
  });
  $('sound').setAttribute('aria-pressed', String(soundOn));
  $('voice').addEventListener('click', () => {
    voiceOn = canSpeak && !voiceOn; store.set('voice', voiceOn);
    $('voice').setAttribute('aria-pressed', String(voiceOn));
    if (voiceOn) speak(nameOf({ ni: 1 }) + '！');
    else if (canSpeak) window.speechSynthesis.cancel();
  });
  if (!canSpeak) { voiceOn = false; $('voice').disabled = true; $('voiceSel').disabled = true; $('voiceTest').disabled = true; }
  else window.speechSynthesis.addEventListener('voiceschanged', fillVoices);
  $('voiceSel').addEventListener('change', e => { store.set('voice.' + lang, e.target.value); speak(nameOf({ ni: 1 }) + '！', { force: true }); });
  $('voiceTest').addEventListener('click', () => speak(nameOf({ ni: 0 }) + '！', { force: true, pitch: voicePitch({ ni: 2 }), rate: 1.15 }));
  $('myName').value = myName;
  $('myName').addEventListener('input', e => {
    myName = e.target.value.trim().slice(0, 8); store.set('myname', myName);
    renderRule();
  });
  $('voice').setAttribute('aria-pressed', String(voiceOn));

  // ---------- 主循环 ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state && state.running) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  applyChoice();
  applyLang();
  loadAvatars();
  showCard('intro');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
